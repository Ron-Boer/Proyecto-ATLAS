<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enlace coordinado del amoníaco, paso a paso (Lewis)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6f9;--surface:#fff;--ink:#14212b;--muted:#516270;--n:#2a62a8;--on:#fff;--pair:#c0267c;--h:#0e7c70;--line:#cfd9e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1820;--surface:#15232d;--ink:#e8eff4;--muted:#9fb2c0;--n:#6aa9e8;--on:#0e1820;--pair:#ff7ac6;--h:#3fd0bd;--line:#2b3d4a}}
:root[data-theme="dark"]{--bg:#0e1820;--surface:#15232d;--ink:#e8eff4;--muted:#9fb2c0;--n:#6aa9e8;--on:#0e1820;--pair:#ff7ac6;--h:#3fd0bd;--line:#2b3d4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:1.3rem;line-height:1.25;margin:0 0 4px;font-weight:600}
.sub{margin:0 0 14px;color:var(--muted);font-size:1.05rem}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit;text-anchor:middle;dominant-baseline:central}
.dots{display:flex;gap:6px;margin:12px 0 0}
.dots button{flex:1;font:inherit;font-size:.8rem;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.dots button[aria-current=step]{background:var(--pair);border-color:var(--pair);color:var(--on);font-weight:600}
.row{display:flex;gap:8px;margin:10px 0 4px}
.row button{flex:1;font:inherit;font-weight:600;font-size:.92rem;padding:9px 6px;border-radius:10px;border:0;background:var(--n);color:var(--on);cursor:pointer}
.row button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--pair);outline-offset:2px}
.card{margin-top:10px;font-size:.96rem}
.card h2{font-size:1.08rem;margin:0 0 6px;font-weight:600}
.card h2 small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
.card p{margin:0 0 8px}
.card .def{border-left:3px solid var(--pair);padding-left:10px}
.card b{color:var(--pair)}
.card .see{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Enlace coordinado del amoníaco, paso a paso</h1>
<p class="sub">NH₃ + H⁺ → NH₄⁺ · modelo de Lewis</p>
<div class="stage">
<svg viewBox="0 0 360 300" role="img" aria-label="Animación paso a paso, en el modelo de Lewis, del enlace coordinado entre NH₃ y H⁺">
<defs><filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="sc"></g>
</svg>
</div>
<div class="dots" id="dots"></div>
<div class="row"><button id="pv" type="button">◀ Anterior</button><button id="au" type="button">Pausa</button><button id="nx" type="button">Siguiente ▶</button></div>
<div class="card" id="card"></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)},PI=Math.PI,cos=Math.cos,sin=Math.sin;
var cl=function(x){return Math.min(1,Math.max(0,x))},es=function(x){return x*x*(3-2*x)},L=function(a,b,k){return a+(b-a)*k},f=function(n){return +n.toFixed(1)};
var C=function(x,y,r,a){return '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r)+'" '+(a||'')+'/>'};
var X=function(x,y,s,a){return '<text x="'+f(x)+'" y="'+f(y)+'" '+(a||'')+'>'+s+'</text>'};
var E=function(x,y,c,k,o){return k*o>.01?C(x,y,3.8*k,'fill="var('+c+')" filter="url(#gl)" opacity="'+o+'"'):''};
var N=[125,135],HS=[[70,80],[70,190],[32,135]],TH=HS.map(function(h){return Math.atan2(h[1]-N[1],h[0]-N[0])});
var SL=['N: 5 e⁻ de valencia · cada H: 1 e⁻','3 pares compartidos = 6 e⁻ enlazantes','6 + 2 = 8 e⁻ → octeto completo','H⁺: 0 e⁻ · orbital 1s vacío','el N dona el par · el H⁺ lo acepta','el par se dirige hacia el H⁺','','NH₄⁺: carga formal del N = 5 − 0 − 4 = +1'];
var ST=[
["Electrones de valencia","Los <b>electrones de valencia</b> son los del último nivel de energía: los únicos que participan en los enlaces. En Lewis se dibujan como puntos.","El N (grupo 15) tiene 5 electrones de valencia, que aparecen numerados; cada H (grupo 1) tiene 1."],
["Enlace covalente","Un <b>enlace covalente</b> es un par de electrones compartido entre dos átomos: cada uno aporta un electrón.","Cada electrón del H se junta con uno del N (azul y verde). Cada par compartido se dibuja como una raya: 3 enlaces N–H."],
["Par libre y octeto","Un <b>par libre</b> (o solitario) es un par de valencia que no forma enlace. La <b>regla del octeto</b> dice que los átomos tienden a rodearse de 8 electrones (el H, de 2).","El N usa 3 pares en enlaces (6 e⁻) y guarda 2 en un par libre (en rosa): 6 + 2 = 8."],
["El ion H⁺","Un <b>catión</b> es un átomo que perdió electrones. El H⁺ es un protón: sin electrones y con el orbital 1s vacío.","Al H de la derecha se le escapa el único electrón (−e⁻) y queda con carga +1 y un hueco que puede alojar 2 electrones."],
["Base y ácido de Lewis","Una <b>base de Lewis</b> dona un par de electrones; un <b>ácido de Lewis</b> lo acepta.","El NH₃ es la base (tiene par libre) y el H⁺ es el ácido (orbital vacío). Las líneas punteadas muestran su atracción."],
["Aproximación y flecha curva","La <b>flecha curva</b> indica el movimiento de un par de electrones: nace en el par y apunta adonde se formará el enlace.","El H⁺ se acerca al par libre del N y la flecha rosa va desde el par hacia el H⁺."],
["Enlace covalente coordinado","Un <b>enlace covalente coordinado</b> (o dativo) es un enlace covalente en el que los dos electrones los aporta un solo átomo, el donante; el aceptor no aporta ninguno.","El par rosa pasa a ser compartido y se forma la raya rosa (a veces se escribe N → H). El recuadro compara 1 + 1 con 2 + 0."],
["El ion amonio, NH₄⁺","La <b>carga formal</b> = e⁻ de valencia − e⁻ no enlazantes − ½ e⁻ enlazantes.","En el N: 5 − 0 − ½·8 = +1, por eso el ion es NH₄⁺. Ya formado, los 4 enlaces son idénticos (la raya rosa se vuelve igual) y forman un tetraedro de 109,5°."]
];
function scene(t,w){
 var s='',i,sh=es(cl(t-1)),k3=es(cl(t-3)),hx=L(300,215,es(cl(t-5))),b=es(cl(t-6)),b2=cl((t-6.4)/.4),ion=cl(t-7),eq=cl((t-7.3)/.5),mid=(N[0]+hx)/2,y=N[1];
 var pop=function(i){return t>=1?1:es(cl(t*6-i))},dop=1-cl((t-2)*2);
 // enlaces N–H y halos
 HS.forEach(function(h,i){var pl=.5+.5*sin(w*3+i*1.6);
  s+='<line x1="'+N[0]+'" y1="'+y+'" x2="'+h[0]+'" y2="'+h[1]+'" stroke="var(--n)" stroke-width="9" stroke-linecap="round" opacity="'+(.22*ion*pl)+'"/>';
  if(sh>.5)s+='<line x1="'+N[0]+'" y1="'+y+'" x2="'+h[0]+'" y2="'+h[1]+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(1-cl((sh-.5)*2))+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>'});
 s+='<line x1="'+N[0]+'" y1="'+y+'" x2="'+hx+'" y2="'+y+'" stroke="var(--n)" stroke-width="9" stroke-linecap="round" opacity="'+(.22*ion*(.5+.5*sin(w*3+5)))+'"/>';
 if(b>.01){s+='<line x1="'+(N[0]+22)+'" y1="'+y+'" x2="'+(hx-14)+'" y2="'+y+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(1-b)+'" stroke="var(--pair)" stroke-width="4.5" stroke-linecap="round" opacity="'+(1-eq)+'"/>'
  +'<line x1="'+(N[0]+22)+'" y1="'+y+'" x2="'+(hx-14)+'" y2="'+y+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" opacity="'+(eq*b)+'"/>'}
 // átomos
 HS.forEach(function(h){s+=C(h[0],h[1],14,'fill="var(--surface)" stroke="var(--ink)" stroke-width="2"')+X(h[0],h[1],'H','fill="var(--ink)" font-size="13"')});
 s+=C(N[0],y,22,'fill="var(--n)"')+X(N[0],y,'N','fill="var(--on)" font-size="22" font-weight="600"');
 // H de la derecha: pierde su electrón y se vuelve H⁺
 var ra=cl((t-2.85)*6),hol=ra*k3*(1-b2),sol=ra*(1-k3*(1-b2)),hc=k3>.5&&b2<.5;
 s+=C(hx,y,14,'fill="var(--surface)" stroke="var(--ink)" stroke-width="2" opacity="'+sol+'"')+C(hx,y,14,'fill="var(--surface)" stroke="var(--h)" stroke-width="2.5" stroke-dasharray="4 3" opacity="'+hol+'"')
  +X(hx,y,hc?'H⁺':'H','fill="var('+(hc?'--h':'--ink')+')" font-size="13" opacity="'+ra+'"');
 if(k3<1&&ra>0){var a=w*2.2;s+=E(hx+14*cos(a)+k3*60,y+14*sin(a)-k3*26,'--h',1,ra*(1-cl(k3*1.3)))}
 s+=X(hx+44,y-38,'−e⁻','fill="var(--h)" font-size="12" opacity="'+(cl((k3-.3)*3)*(1-cl((t-4)*3)))+'"');
 s+=C(hx+14,y-17,7,'fill="var(--surface)" stroke="var(--h)" stroke-width="1.5" opacity="'+(cl((k3-.5)*3)*(1-b2))+'"')+X(hx+14,y-17,'+','fill="var(--h)" font-size="11" font-weight="600" opacity="'+(cl((k3-.5)*3)*(1-b2))+'"');
 var vo=cl(t-3.5)*(1-cl((t-6)*2));
 s+=C(hx,y,21+2*sin(w*3),'fill="none" stroke="var(--h)" stroke-dasharray="2 3" opacity="'+(vo*.8)+'"')+X(hx,y+32,'orbital 1s vacío','fill="var(--h)" font-size="9" opacity="'+vo+'"');
 // electrones de enlace N–H
 HS.forEach(function(h,i){var c=cos(TH[i]),sn=sin(TH[i]),mx=(N[0]+h[0])/2,my=(y+h[1])/2;
  s+=E(L(N[0]+28*c,mx+3.6*sn,sh),L(y+28*sn,my-3.6*c,sh),'--n',pop(i),dop)+E(L(h[0]-22*c,mx-3.6*sn,sh),L(h[1]-22*sn,my+3.6*c,sh),'--h',pop(5),dop);
  s+=X(N[0]+44*c,y+44*sn,i+1,'fill="var(--muted)" font-size="9" opacity="'+(pop(i)*(1-cl((t-1)*3)))+'"')});
 // par libre (que luego se dona)
 var lx=[L(N[0]+28,mid-5,b),L(N[0]+28,mid+5,b)],ly=[L(y-6,y,b),L(y+6,y,b)],pk=cl((t-2)*4),pO=1-cl((t-7)*2.5);
 s+=X(N[0]+46,y-20,'4','fill="var(--muted)" font-size="9" opacity="'+(pop(3)*(1-cl((t-1)*3)))+'"')+X(N[0]+46,y+22,'5','fill="var(--muted)" font-size="9" opacity="'+(pop(4)*(1-cl((t-1)*3)))+'"');
 s+=C((lx[0]+lx[1])/2,(ly[0]+ly[1])/2,13+3*sin(w*4),'fill="var(--pair)" opacity="'+(.2*cl(t-2)*(1-cl(t-6.1))*(1-b*.5))+'"');
 for(i=0;i<2;i++)s+=E(lx[i],ly[i],'--n',pop(3+i),(1-pk)*pO)+E(lx[i],ly[i],'--pair',pop(3+i)*1.2,pk*pO);
 var lo=cl(t-2.1)*(1-cl((t-3.2)*2));
 s+=X(N[0]+66,y+40,'par libre','fill="var(--pair)" font-size="11" font-weight="600" opacity="'+lo+'"');
 // octeto y dueto
 var o1=cl(t-2)*(1-cl((t-3.2)*1.25)),o2=cl(t-7.2),ro=Math.max(o1,o2);
 s+='<circle cx="'+N[0]+'" cy="'+y+'" r="38" pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(1-cl(t-2))+'" transform="rotate(-90 '+N[0]+' '+y+')" fill="none" stroke="var(--n)" stroke-width="2" opacity="'+ro+'"/>'
  +X(N[0],y-50,o2>o1?'8 e⁻ (octeto)':'6 + 2 = 8 e⁻','fill="var(--n)" font-size="11" font-weight="600" opacity="'+ro+'"');
 HS.concat([[hx,y]]).forEach(function(h){s+=C(h[0],h[1],20,'fill="none" stroke="var(--h)" stroke-width="1.6" stroke-dasharray="3 3" opacity="'+o2+'"')});
 s+=X(hx,y+34,'2 e⁻ (dueto)','fill="var(--h)" font-size="9" opacity="'+o2+'"');
 // base y ácido de Lewis
 var a4=cl(t-4)*(1-cl((t-5.05)*4));
 [-1,0,1].forEach(function(j){s+='<path d="M164 '+(y+j*4)+'C200 '+(y+j*22)+' 250 '+(y+j*22)+' 284 '+(y+j*4)+'" fill="none" stroke="var(--pair)" stroke-width="1.5" stroke-dasharray="4 5" stroke-dashoffset="'+f(-w*22)+'" opacity="'+(.6*a4)+'"/>'});
 s+=X(170,96,'BASE de Lewis','fill="var(--pair)" font-size="11" font-weight="600" opacity="'+a4+'"')+X(170,110,'dona el par','fill="var(--pair)" font-size="9" opacity="'+a4+'"')
  +X(300,96,'ÁCIDO de Lewis','fill="var(--h)" font-size="11" font-weight="600" opacity="'+a4+'"')+X(300,110,'acepta el par','fill="var(--h)" font-size="9" opacity="'+a4+'"');
 // flecha curva
 var ap=cl((t-5.2)/.7),af=1-cl((t-6.4)*2.5);
 if(ap>0)s+='<g opacity="'+af+'" fill="none" stroke="var(--pair)" stroke-width="2.4" stroke-linecap="round"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(1-ap)+'" d="M'+(N[0]+28)+' '+(y-12)+'C'+(N[0]+40)+' '+(y-62)+' '+(hx-16)+' '+(y-62)+' '+(hx-5)+' '+(y-20)+'"/>'+(ap>.97?'<polygon fill="var(--pair)" stroke="none" points="'+(hx-5)+','+(y-14)+' '+(hx-12)+','+(y-26)+' '+(hx+2)+','+(y-27)+'"/>':'')+'</g>'+X(mid,y-76,'movimiento del par','fill="var(--pair)" font-size="10" opacity="'+(ap*af)+'"');
 // etiqueta del enlace dativo y carga formal
 var nh=cl(t-6.6)*(1-eq);
 s+=X(mid,y-20,'N → H','fill="var(--pair)" font-size="12" font-weight="600" opacity="'+nh+'"')+X(mid,y+20,'enlace dativo','fill="var(--pair)" font-size="9" opacity="'+nh+'"');
 var fc=cl((t-7.3)*4);
 s+=C(N[0]+17,y-27,8,'fill="var(--surface)" stroke="var(--pair)" stroke-width="1.5" opacity="'+fc+'"')+X(N[0]+17,y-27,'+','fill="var(--pair)" font-size="12" font-weight="600" opacity="'+fc+'"');
 // corchetes del ion
 s+='<g opacity="'+ion+'" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"><path d="M16 30H8V226H16"/><path d="M232 30H240V226H232"/>'+X(252,42,'+','fill="var(--ink)" stroke="none" font-size="20" font-weight="600"')+'</g>';
 // comparación 1+1 vs 2+0
 var tr=cl((t-6.4)*3)*(1-cl((t-7)*3));
 if(tr>0){var d1=cl((t-6.5)*4),d2=cl((t-6.8)*4);
  s+='<g opacity="'+tr+'" font-size="11"><rect x="10" y="238" width="340" height="54" rx="10" fill="var(--surface)" stroke="var(--line)"/>'
  +X(22,254,'Covalente normal','text-anchor="start" fill="var(--muted)"')+C(150,254,4.5,'fill="var(--n)"')+C(166,254,4.5,'fill="var(--h)"')+X(184,254,'1 + 1 e⁻ (uno cada uno)','text-anchor="start" fill="var(--muted)"')
  +X(22,277,'Coordinado','text-anchor="start" fill="var(--pair)" font-weight="600"')+C(150,277,4.5*d1,'fill="var(--pair)"')+C(166,277,4.5*d1,'fill="var(--pair)"')+C(184,277,4.5,'fill="none" stroke="var(--h)" stroke-dasharray="2 2"')+X(198,277,'2 + 0 e⁻ (los pone el N)','text-anchor="start" fill="var(--pair)" opacity="'+d2+'"')+'</g>'}
 // tetraedro
 var te=cl((t-7.5)*2);
 if(te>0)s+='<g opacity="'+te+'"><g stroke="var(--line)" stroke-width="1.6" fill="none" stroke-linejoin="round"><path d="M318 172L292 208L318 226L344 208ZM318 172L318 226"/><path d="M292 208L344 208" stroke-dasharray="3 3"/></g>'
  +C(318,172,3.5,'fill="var(--h)"')+C(292,208,3.5,'fill="var(--h)"')+C(318,226,3.5,'fill="var(--h)"')+C(344,208,3.5,'fill="var(--h)"')+C(318,200,5,'fill="var(--n)"')+X(318,243,'tetraedro · 109,5°','fill="var(--muted)" font-size="9"')+'</g>';
 // línea de estado
 var st=Math.min(7,Math.max(0,Math.ceil(t-1e-6)-1));
 if(SL[st])s+=X(180,268,SL[st],'fill="var(--muted)" font-size="12" opacity="'+cl((t-st)*5)+'"');
 return s}
var tau=0,target=1,auto=true,hold=0,last=0,w=0,cs=-1,RED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var dots=$('dots');
for(var k=0;k<8;k++)(function(k){var b=document.createElement('button');b.type='button';b.textContent=k+1;b.setAttribute('aria-label','Paso '+(k+1));b.onclick=function(){auto=false;target=k+1;ui()};dots.appendChild(b)})(k);
function ui(){$('au').textContent=auto?'Pausa':(tau>=8?'Repetir':'Auto');$('pv').disabled=Math.round(target)<=1;$('nx').disabled=Math.round(target)>=8}
function card(s){var c=ST[s];$('card').innerHTML='<h2><small>Paso '+(s+1)+' de 8</small>'+c[0]+'</h2><p class="def">'+c[1]+'</p><p class="see">'+c[2]+'</p>';
 Array.prototype.forEach.call(dots.children,function(b,i){if(i==s)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}
$('pv').onclick=function(){auto=false;target=Math.max(1,Math.round(target)-1);ui()};
$('nx').onclick=function(){auto=false;target=Math.min(8,Math.round(target)+1);ui()};
$('au').onclick=function(){if(auto){auto=false}else{if(tau>=8){tau=0;target=1}auto=true;hold=0}ui()};
function frame(now){var dt=Math.min(.1,(now-last)/1000);last=now;w=RED?0:now/1000;
 if(tau!==target){var d=target-tau,sp=Math.max(1,Math.abs(d)*1.5)/2.6;tau=RED?target:tau+(d>0?1:-1)*Math.min(Math.abs(d),sp*dt);if(tau===target){hold=now+1800;ui()}}
 else if(auto&&now>hold){if(target<8){target++}else{auto=false;ui()}}
 var s=Math.min(7,Math.max(0,Math.ceil(tau-1e-6)-1));if(s!==cs){cs=s;card(s)}
 $('sc').innerHTML=scene(tau,w);requestAnimationFrame(frame)}
if(RED){auto=false;tau=target=1}
ui();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
